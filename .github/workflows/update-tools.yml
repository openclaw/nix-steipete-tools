name: update-tools

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Derive updated package hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply .github/pnpm-migration.patch
          go run ./cmd/update-tools
          python3 - <<'PY'
          import json, pathlib
          print('NIX_PROOF_FILES_BEGIN')
          print(json.dumps({str(p): p.read_text() for p in pathlib.Path('nix/pkgs').glob('*.nix')}, sort_keys=True))
          print('NIX_PROOF_FILES_END')
          PY
      - name: Build and run updated summarize
        run: |
          result_path="$(nix build .#summarize --no-link --print-out-paths --print-build-logs)"
          "$result_path/bin/summarize" --version
          "$result_path/bin/summarize" --help
